<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LW-SHADE-001 viewer</title>
  <link rel="stylesheet" href="/viewer.css" />
  <script type="importmap">
    {"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}
  </script>
</head>
<body>
  <div id="app">
    <div id="toolbar">
      <div id="poses"></div>
      <label>Angle <input id="angle" type="range" min="0" max="60" step="0.5" value="0" /></label>
      <span id="angle-value">0°</span>
      <button id="play">Play</button>
      <button id="reset">Reset</button>
      <button id="explode">Explode</button>
    </div>
    <div id="model"><canvas id="c"></canvas></div>
    <div id="info">
      <div>Components: <span id="components"></span></div>
      <div>Joint: <span id="joint"></span></div>
      <div>Status: <span id="status" data-state="loading">loading</span></div>
      <div>Witness: <span id="witness"></span></div>
    </div>
  </div>
  <script type="module" src="/viewer.mjs"></script>
</body>
</html>
